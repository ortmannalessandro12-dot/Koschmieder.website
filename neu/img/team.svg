.sun{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
