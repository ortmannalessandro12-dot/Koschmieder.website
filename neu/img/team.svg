<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Zeichnung: Team vor dem Firmenwagen">
<style>
.wink{transform-box:view-box;transform-origin:108px 150px;animation:wink 2.6s ease-in-out infinite}
