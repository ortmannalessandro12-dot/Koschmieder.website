<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Haus mit Solaranlage für Warmwasser und Heizung">
<style>
.rays{transform-box:view-box;transform-origin:330px 62px;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sun{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.shine{animation:shine 3.8s ease-in-out infinite}
@keyframes shine{0%{transform:translateX(-160px);opacity:0}15%{opacity:.75}60%{opacity:.75}75%,100%{transform:translateX(160px);opacity:0}}
.heat{animation:heat 2.8s ease-in-out infinite;opacity:0}
.h2{animation-delay:-.9s}.h3{animation-delay:-1.8s}
@keyframes heat{0%{transform:translateY(8px);opacity:0}35%{opacity:.85}100%{transform:translateY(-26px);opacity:0}}
.flow{stroke-dasharray:9 10;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-19}}
.cloud{animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(460px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.heat{opacity:.7}.shine{opacity:0}}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE3F8"/><stop offset="1" stop-color="#F1F6FC"/></linearGradient>
<clipPath id="panels"><path d="M96 154 166 98H252L196 154Z M208 154 264 98H330L292 154Z"/></clipPath>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<rect width="400" height="300" fill="url(#sky)"/>
<g class="cloud" fill="#fff" opacity=".9"><ellipse cx="60" cy="56" rx="34" ry="12"/><ellipse cx="80" cy="48" rx="20" ry="13"/></g>
<g class="rays" stroke="#F3D400" stroke-width="5" stroke-linecap="round">
  <path d="M330 18v10M330 96v10M286 62h10M364 62h10M299 31l7 7M354 86l7 7M361 31l-7 7M306 86l-7 7"/>
</g>
<circle class="sun" cx="330" cy="62" r="24" fill="#F3E400"/>
<!-- Hügel -->
<path d="M0 222C70 204 140 210 210 216S330 204 400 210V300H0Z" fill="#B9D29A"/>
<path d="M0 246C90 232 170 238 250 242S350 236 400 238V300H0Z" fill="#9EC07C"/>
<!-- Haus -->
<rect x="96" y="154" width="196" height="96" fill="#FFFFFF" stroke="#C9D1DE" stroke-width="2"/>
<path d="M74 160 166 86H338L310 160Z" fill="#D7432F"/>
<path d="M74 160 166 86" stroke="#B8362A" stroke-width="4"/>
<g stroke="#C23A29" stroke-width="1.5" opacity=".6"><path d="M101 138H316M124 120H324M146 102H332"/></g>
<!-- Kollektoren -->
<g>
  <path d="M96 154 166 98H252L196 154Z" fill="#1E2B55"/>
  <path d="M208 154 264 98H330L292 154Z" fill="#1E2B55"/>
  <g stroke="#3B5594" stroke-width="2.2" fill="none" clip-path="url(#panels)">
    <path d="M110 143H300M124 132H306M138 121H314M152 110H322"/>
  </g>
  <g clip-path="url(#panels)"><g transform="translate(140 0) skewX(-30)"><rect class="shine" x="60" y="90" width="60" height="70" fill="url(#sh)"/></g></g>
  <path d="M96 154 166 98H252L196 154Z M208 154 264 98H330L292 154Z" fill="none" stroke="#9FB0D0" stroke-width="2"/>
</g>
<g fill="none" stroke="#D7432F" stroke-width="3.5" stroke-linecap="round">
  <path class="heat" d="M170 90c-5-6 5-10 0-16s5-10 0-16"/>
  <path class="heat h2" d="M220 90c-5-6 5-10 0-16s5-10 0-16"/>
  <path class="heat h3" d="M276 90c-5-6 5-10 0-16s5-10 0-16"/>
</g>
<!-- Fenster und Tür -->
<g fill="#CFE3F8" stroke="#1E2B55" stroke-width="3"><rect x="118" y="178" width="38" height="34" rx="2"/><rect x="234" y="178" width="38" height="34" rx="2"/></g>
<path d="M137 178v34M118 195h38M253 178v34M234 195h38" stroke="#1E2B55" stroke-width="2"/>
<rect x="180" y="196" width="30" height="54" rx="3" fill="#1E2B55"/>
<!-- Leitung zum Speicher -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M300 152V236H330" stroke="#C9D1DE" stroke-width="9"/>
  <path class="flow" d="M300 152V236H330" stroke="#D7432F" stroke-width="3.5"/>
</g>
<rect x="326" y="196" width="34" height="56" rx="14" fill="#fff" stroke="#C9D1DE" stroke-width="2"/>
<rect x="334" y="214" width="18" height="5" rx="2.5" fill="#D7432F"/>
</svg>
