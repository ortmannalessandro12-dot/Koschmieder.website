<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Zeichnung: Pelletheizung mit Vorratsbehälter und Pufferspeicher">
<style>
.p{animation:drop 1.6s linear infinite;opacity:0}
.p2{animation-delay:-.4s}.p3{animation-delay:-.8s}.p4{animation-delay:-1.2s}
@keyframes drop{0%{transform:translateY(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .9s ease-in-out infinite alternate}
.flame.b{animation-duration:.65s;animation-delay:-.3s}
@keyframes flicker{0%{transform:scale(1,1)}50%{transform:scale(.9,1.14)}100%{transform:scale(1.06,.9)}}
.flow{stroke-dasharray:10 12;animation:flow 1.2s linear infinite}
.flow.back{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-22}}
.lvl{transform-box:fill-box;transform-origin:50% 100%;animation:lvl 6s ease-in-out infinite alternate}
@keyframes lvl{from{transform:scaleY(1)}to{transform:scaleY(.82)}}
.led{animation:blink 2.4s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.p{opacity:1}}
</style>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF2F8"/><stop offset="1" stop-color="#E2E8F1"/></linearGradient>
<linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EAF1"/></linearGradient>
<linearGradient id="tank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F3F5F9"/><stop offset="1" stop-color="#DCE2EC"/></linearGradient>
<pattern id="pel" width="10" height="7" patternUnits="userSpaceOnUse"><rect x="1" y="1" width="7" height="3.4" rx="1.7" fill="#A8743F"/><rect x="5" y="4" width="6" height="3" rx="1.5" fill="#8E5F31"/></pattern>
<clipPath id="hop"><rect x="168" y="62" width="62" height="70" rx="6"/></clipPath>
</defs>
<rect width="400" height="300" fill="url(#wall)"/>
<rect y="236" width="400" height="64" fill="#D6DDE8"/>
<path d="M0 236H400" stroke="#C7CFDC" stroke-width="2"/>
<ellipse cx="128" cy="240" rx="80" ry="6" fill="#C2CAD8"/>
<ellipse cx="322" cy="240" rx="44" ry="6" fill="#C2CAD8"/>
<!-- Rohre zum Speicher -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M110 80V44H322V58" stroke="#C9D1DE" stroke-width="12"/>
  <path d="M140 80V60H300V72" stroke="#C9D1DE" stroke-width="12"/>
  <path class="flow" d="M110 80V44H322V58" stroke="#D7432F" stroke-width="5"/>
  <path class="flow back" d="M140 80V60H300V72" stroke="#3E6FB8" stroke-width="5"/>
</g>
<!-- Vorratsbehälter -->
<rect x="164" y="58" width="70" height="78" rx="8" fill="url(#body)" stroke="#C9D1DE" stroke-width="2"/>
<g clip-path="url(#hop)"><rect class="lvl" x="168" y="84" width="62" height="48" fill="url(#pel)"/></g>
<rect x="168" y="62" width="62" height="70" rx="6" fill="none" stroke="#C9D1DE" stroke-width="2"/>
<path d="M176 70l10-6M176 80l22-14" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8"/>
<!-- Förderschacht -->
<rect x="188" y="134" width="22" height="46" fill="#E8EDF5" stroke="#C9D1DE" stroke-width="2"/>
<rect x="150" y="166" width="60" height="16" rx="3" fill="#DCE2EC" stroke="#C9D1DE" stroke-width="2"/>
<g fill="#A8743F">
  <rect class="p" x="192" y="136" width="7" height="3.4" rx="1.7"/>
  <rect class="p p2" x="199" y="136" width="7" height="3.4" rx="1.7"/>
  <rect class="p p3" x="195" y="136" width="7" height="3.4" rx="1.7"/>
  <rect class="p p4" x="200" y="136" width="7" height="3.4" rx="1.7"/>
</g>
<!-- Kessel -->
<rect x="60" y="78" width="104" height="158" rx="12" fill="url(#body)" stroke="#C9D1DE" stroke-width="2"/>
<rect x="74" y="92" width="76" height="24" rx="5" fill="#1E2B55"/>
<rect x="82" y="99" width="30" height="10" rx="2" fill="#2F4A86"/>
<circle class="led" cx="138" cy="104" r="4" fill="#5BD48A"/>
<rect x="84" y="140" width="56" height="56" rx="10" fill="#1E2B55"/>
<path class="flame" d="M112 188c-14 0-19-11-13-21 3-5 8-8 8-15 7 5 10 11 9 16 3-2 4-5 4-8 6 6 8 12 6 18-2 6-7 10-14 10z" fill="#D7432F"/>
<path class="flame b" d="M112 188c-7 0-10-6-7-11 2-3 4-4 4-8 4 3 6 6 5 9 2-1 3-3 3-4 3 3 4 6 3 9-1 3-4 5-8 5z" fill="#F3E400"/>
<rect x="96" y="190" width="32" height="5" rx="2" fill="#A8743F"/>
<path d="M74 214H150" stroke="#DCE2EC" stroke-width="2"/>
<g transform="translate(22 0)">
<!-- Pelletsack -->
<path d="M196 236c-6 0-8-6-6-18l6-34c1-6 5-8 10-8h28c5 0 9 2 10 8l6 34c2 12 0 18-6 18z" fill="#F4E9D8" stroke="#D9C8AE" stroke-width="2"/>
<path d="M204 176c4-6 8-8 13-8s9 2 13 8" fill="none" stroke="#D9C8AE" stroke-width="2"/>
<rect x="202" y="196" width="40" height="18" rx="3" fill="#2F6B4F"/>
<path d="M210 205h24" stroke="#F4E9D8" stroke-width="3" stroke-linecap="round"/>
<g fill="#A8743F"><rect x="252" y="232" width="7" height="3.4" rx="1.7"/><rect x="262" y="229" width="7" height="3.4" rx="1.7" transform="rotate(30 265 231)"/><rect x="258" y="226" width="6" height="3" rx="1.5" fill="#8E5F31"/></g>
</g>
<!-- Pufferspeicher -->
<rect x="282" y="56" width="80" height="180" rx="36" fill="url(#tank)" stroke="#C9D1DE" stroke-width="2"/>
<path d="M292 100H352M292 190H352" stroke="#E1E6EE" stroke-width="2"/>
<rect x="304" y="132" width="36" height="7" rx="3.5" fill="#D7432F" opacity=".85"/>
<rect x="304" y="146" width="26" height="7" rx="3.5" fill="#3E6FB8" opacity=".85"/>
</svg>
