<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Heizungsraum mit Kessel und Speicher">
<style>
.flow{stroke-dasharray:10 12;animation:flow 1.2s linear infinite}
.flow.back{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-22}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker .9s ease-in-out infinite alternate}
.flame.b{animation-duration:.7s;animation-delay:-.3s}
@keyframes flicker{0%{transform:scale(1,1)}50%{transform:scale(.92,1.12)}100%{transform:scale(1.05,.9)}}
.rotor{transform-box:fill-box;transform-origin:center;animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.needle{transform-box:view-box;transform-origin:332px 132px;animation:needle 4s ease-in-out infinite alternate}
@keyframes needle{from{transform:rotate(-30deg)}to{transform:rotate(25deg)}}
.led{animation:blink 2.4s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF2F8"/><stop offset="1" stop-color="#E2E8F1"/></linearGradient>
<linearGradient id="tank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F3F5F9"/><stop offset="1" stop-color="#DCE2EC"/></linearGradient>
<linearGradient id="boiler" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6EAF1"/></linearGradient>
</defs>
<rect width="400" height="300" fill="url(#wall)"/>
<rect y="236" width="400" height="64" fill="#D6DDE8"/>
<path d="M0 236H400" stroke="#C7CFDC" stroke-width="2"/>
<g opacity=".5" stroke="#D3DAE6" stroke-width="1"><path d="M0 60H400M0 120H400M0 180H400"/></g>
<ellipse cx="112" cy="240" rx="62" ry="6" fill="#C2CAD8"/>
<ellipse cx="300" cy="240" rx="52" ry="6" fill="#C2CAD8"/>
<!-- Rohre hinten -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M96 76V40H272V54" stroke="#C9D1DE" stroke-width="12"/>
  <path d="M128 76V56H244V70" stroke="#C9D1DE" stroke-width="12"/>
  <path class="flow" d="M96 76V40H272V54" stroke="#D7432F" stroke-width="5"/>
  <path class="flow back" d="M128 76V56H244V70" stroke="#3E6FB8" stroke-width="5"/>
</g>
<!-- Pumpe -->
<g transform="translate(184 40)"><circle r="13" fill="#1E2B55"/><g class="rotor"><path d="M0-8 2 0 0 8-2 0Z M-8 0 0-2 8 0 0 2Z" fill="#9FB0D0"/></g><circle r="2.5" fill="#fff"/></g>
<!-- Kessel -->
<rect x="58" y="72" width="108" height="164" rx="12" fill="url(#boiler)" stroke="#C9D1DE" stroke-width="2"/>
<rect x="72" y="86" width="80" height="26" rx="5" fill="#1E2B55"/>
<rect x="80" y="94" width="34" height="10" rx="2" fill="#2F4A86"/>
<circle class="led" cx="140" cy="99" r="4" fill="#5BD48A"/>
<rect x="84" y="140" width="56" height="56" rx="10" fill="#1E2B55"/>
<path class="flame" d="M112 188c-14 0-19-11-13-21 3-5 8-8 8-15 7 5 10 11 9 16 3-2 4-5 4-8 6 6 8 12 6 18-2 6-7 10-14 10z" fill="#D7432F"/>
<path class="flame b" d="M112 188c-7 0-10-6-7-11 2-3 4-4 4-8 4 3 6 6 5 9 2-1 3-3 3-4 3 3 4 6 3 9-1 3-4 5-8 5z" fill="#F3E400"/>
<path d="M72 214H152" stroke="#DCE2EC" stroke-width="2"/>
<!-- Speicher -->
<rect x="250" y="52" width="100" height="184" rx="44" fill="url(#tank)" stroke="#C9D1DE" stroke-width="2"/>
<path d="M262 100H338M262 190H338" stroke="#E1E6EE" stroke-width="2"/>
<g transform="translate(332 132)"><circle r="17" fill="#fff" stroke="#1E2B55" stroke-width="3"/><path d="M-10 6A12 12 0 0 1 10 6" fill="none" stroke="#D7432F" stroke-width="3"/></g>
<path class="needle" d="M332 132L332 119" stroke="#1E2B55" stroke-width="3" stroke-linecap="round"/>
<circle cx="332" cy="132" r="3" fill="#1E2B55"/>
<rect x="274" y="150" width="24" height="6" rx="3" fill="#D7432F" opacity=".85"/>
<rect x="274" y="162" width="18" height="6" rx="3" fill="#3E6FB8" opacity=".85"/>
<!-- Rohre unten -->
<g fill="none" stroke-linecap="round"><path d="M166 214H250" stroke="#C9D1DE" stroke-width="10"/><path class="flow" d="M166 214H250" stroke="#3E6FB8" stroke-width="4"/></g>
<g transform="translate(208 214)"><rect x="-9" y="-12" width="18" height="24" rx="3" fill="#1E2B55"/><path d="M-5 0H5" stroke="#F3E400" stroke-width="3" stroke-linecap="round"/></g>
</svg>
